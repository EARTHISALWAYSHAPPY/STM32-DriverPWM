        // สกัดข้อมูลอุณหภูมิ (T2) และความต้านทาน (Resister) ด้วย Regex
        const parsedData = [];
        const lines = rawDataText.trim().split('\n');
        
        // รูปแบบสำหรับดึงค่าตัวเลข
        const regex = /T2:\s*(-?\d+\.\d+).*?Resister\s*=\s*(\d+\.\d+)/;

        lines.forEach(line => {
            const match = line.match(regex);
            if (match) {
                parsedData.push({
                    t: parseFloat(match[1]), // อุณหภูมิ
                    r: parseFloat(match[2])  // ความต้านทาน
                });
            }
        });

        // เพื่อให้กราฟดูง่าย เรียงตามอุณหภูมิจากน้อยไปมาก
        parsedData.sort((a, b) => a.t - b.t);

        // นำข้อมูลไปแปลงฟอร์แมตเพื่อใส่ใน Chart.js
        const chartDataPoints = parsedData.map(d => ({ x: d.t, y: d.r }));
        const totalPoints = parsedData.length;

        // อัปเดต UI 
        const slider = document.getElementById("dataSlider");
        slider.max = totalPoints - 1;
        document.getElementById("valTotal").innerText = totalPoints;

        // สร้างกราฟ
        const ctx = document.getElementById('myChart').getContext('2d');
        const myChart = new Chart(ctx, {
            type: 'line',
            data: {
                datasets: [
                    {
                        label: 'Selected Point',
                        data: [chartDataPoints[0]],
                        backgroundColor: 'red',
                        borderColor: 'red',
                        pointRadius: 8,
                        showLine: false,
                        order: 1
                    },
                    {
                        label: 'T2 vs Resistance Data',
                        data: chartDataPoints,
                        backgroundColor: 'rgba(0, 0, 255, 0.1)',
                        borderColor: 'blue',
                        borderWidth: 2,
                        pointRadius: 3,
                        showLine: true,
                        order: 2
                    }
                ]
            },
            options: {
                responsive: true,
                animation: false, // ปิด animation ทำให้สไลเดอร์ไม่กระตุก
                scales: {
                    x: {
                        type: 'linear',
                        title: { display: true, text: 'Temperature (°C)' }
                    },
                    y: {
                        title: { display: true, text: 'Resistance (Ω)' }
                    }
                }
            }
        });

        // ฟังก์ชันเมื่อเลื่อน Slider ให้กราฟและตัวเลขขยับตาม
        slider.addEventListener('input', function(e) {
            const index = parseInt(e.target.value);
            const pt = parsedData[index];
            
            // อัปเดตตัวเลข
            document.getElementById("valIndex").innerText = index + 1;
            document.getElementById("valTemp").innerText = pt.t.toFixed(2);
            document.getElementById("valRes").innerText = pt.r.toFixed(2);

            // อัปเดตจุดสีแดงในกราฟ
            myChart.data.datasets[0].data = [{ x: pt.t, y: pt.r }];
            myChart.update('none'); // อัปเดตทันทีแบบไม่เล่นอนิเมชัน
        });

        // จำลองการขยับสไลเดอร์ครั้งแรกเพื่อเซ็ตค่าเริ่มต้น
        slider.dispatchEvent(new Event('input'));
    </script>
